spring.application.name=rental-management

# 2. DATABASE CONFIGURATION
# Values can be overridden via environment variables so real credentials
# never need to be committed to source control.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rental_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# 3. SPRING DATA JPA & HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.jackson.deserialization.fail-on-null-for-primitives=false
